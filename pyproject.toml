[project]
name = "expertatlas"
version = "1.0.0"
description = "Base-rate-controlled map of expert specialisation in a Mixture-of-Experts LLM (OLMoE-1B-7B-0924)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "pyarrow>=17.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "umap-learn>=0.5",
  "networkx>=3.3",
  "python-louvain>=0.16",
  "typer>=0.12",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
atlas = "expertatlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expertatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
